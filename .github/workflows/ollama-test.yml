name: Code Review
'on':
  pull_request:
    types: [opened, synchronize, reopened, edited]
jobs:
  summarize:
    runs-on: ubuntu-latest
    steps:
      - name: Run ollama
        run: |
          ollama serve &
          ollama pull llama3.2:latest
      - name: Checkout pull request HEAD
        id: checkout_pr_head
        uses: actions/checkout@v2
        with:
          fetch-depth: 0
      - name: Code Review
        run: |
          git checkout ${{ github.base_ref }}
          git pull
          command="ollama run deepseek-r1:8b"
          git checkout ${{ github.head_ref }}
          echo "Reviewing Pull Request for branch $(git branch --show) : "
          mycode=$(git diff ${{ github.base_ref }})
          $command "Review this code: $mycode, provide suggestions for improvement, coding best practices, improve readability, and maintainability. Remove any code smells and anti-patterns. Provide code examples for your suggestion. Respond in markdown format. If the file does not have any code or does not need any changes, say 'No changes needed'."